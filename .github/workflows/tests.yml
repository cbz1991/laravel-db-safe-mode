name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10: PHP 8.1 - 8.3
          - { php: '8.1', laravel: '10.*' }
          - { php: '8.2', laravel: '10.*' }
          - { php: '8.3', laravel: '10.*' }
          # Laravel 11: PHP 8.2 - 8.4
          - { php: '8.2', laravel: '11.*' }
          - { php: '8.3', laravel: '11.*' }
          - { php: '8.4', laravel: '11.*' }
          # Laravel 12: PHP 8.2 - 8.5
          - { php: '8.2', laravel: '12.*' }
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.5', laravel: '12.*' }
          # Laravel 13: PHP 8.3 - 8.5
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        env:
          # Authenticate Composer with the runner token to avoid GitHub API rate limits.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Composer 2.9+ refuses packages with security advisories by default. The
          # matrix deliberately tests end-of-life Laravel releases, so allow them here.
          composer config audit.block-insecure false
          # Larastan and Pint need newer PHP / Laravel than the oldest pairs here;
          # they run in the "quality" job instead.
          composer remove --dev larastan/larastan laravel/pint --no-interaction --no-update
          composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: mysql, port: 3306, username: root }
          - { db: mariadb, port: 3307, username: root }
          - { db: pgsql, port: 5432, username: postgres }

    name: ${{ matrix.db }} - PHP 8.4 - Laravel 13

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: safe_mode
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: safe_mode
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: safe_mode
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer require --dev "laravel/framework:13.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: safe_mode
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
        run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest

    name: Static analysis & code style

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse
